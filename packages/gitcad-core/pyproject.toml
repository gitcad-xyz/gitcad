[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitcad-core"
version = "0.9.0"
description = "gitcad core: canonical text, entity/feature identity, the Part standard, report pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Dan Willis", email = "danielcwillis@gmail.com"}]
keywords = ["cad", "brep", "git", "agent", "headless", "part", "identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# Pure standard library — the dependency-free foundation.
dependencies = []

[project.urls]
Homepage = "https://gitcad.xyz"
Repository = "https://github.com/gitcad-xyz/gitcad"
Issues = "https://github.com/gitcad-xyz/gitcad/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gitcad"]
