[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitcad-ecad"
version = "0.9.1"
description = "gitcad electrical: schematic and ERC, board and DRC, connectivity, fabrication outputs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Dan Willis", email = "danielcwillis@gmail.com"}]
keywords = ["eda", "ecad", "pcb", "schematic", "gerber", "drc", "erc", "ipc-2581"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["gitcad-core==0.9.1"]

[project.urls]
Homepage = "https://gitcad.xyz"
Repository = "https://github.com/gitcad-xyz/gitcad"
Issues = "https://github.com/gitcad-xyz/gitcad/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gitcad"]
