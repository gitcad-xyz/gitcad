name: release

# Build (and publish) the four gitcad distributions:
#   gitcad-core, gitcad-mech, gitcad-ecad, gitcad (metapackage).
# Pushes/PRs build + `twine check` only. Publishing runs via PyPI Trusted
# Publishing (OIDC, no tokens) on either:
#   * a v* tag                     -> publish ALL four, or
#   * a manual run (workflow_dispatch with the `package` input) -> publish ONE.
# The per-package manual path suits incremental first releases: register each
# project's pending publisher (environment: pypi) and publish it, one at a time.
# See RELEASING.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Which distribution to publish
        type: choice
        default: all
        options: [all, gitcad-core, gitcad-mech, gitcad-ecad, gitcad]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [gitcad-core, gitcad-mech, gitcad-ecad, gitcad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - run: python -m build packages/${{ matrix.pkg }} --outdir dist
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.pkg }}
          path: dist/*

  publish:
    name: publish to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - name: Select dists to publish
        run: |
          mkdir -p dist
          pkg="${{ github.event.inputs.package }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$pkg" != "all" ]; then
            echo "Publishing single package: $pkg"
            cp staged/dist-$pkg/* dist/
          else
            echo "Publishing all four packages"
            cp staged/dist-*/* dist/
          fi
          ls -l dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
