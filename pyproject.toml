# Workspace root — NOT a package. The distributions live in packages/:
#   gitcad-core / gitcad-mech / gitcad-ecad / gitcad (metapackage)
# Dev install (editable, all portions):
#   pip install --no-deps -e packages/gitcad-core -e packages/gitcad-mech \
#       -e packages/gitcad-ecad -e packages/gitcad
#   pip install pytest forgekernel forgekernel_rs

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "forge_gap: exercises a capability forge does not yet reach (a named K2.2/K3.7/K5.2 refusal); skipped until forge closes the gap — OCCT no longer backfills it (ADR-0020)",
  "invariant: architecture-independent property that must always hold",
  "kernel: needs a real geometry kernel; deselected by the null-kernel job. Applied automatically by tests/conftest.py to any module that references forgekernel, because ADR-0018's occt marker was deleted in #107 and nothing replaced it — which is why the null-kernel suite silently stopped working",
]
